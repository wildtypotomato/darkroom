[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darkroom"
version = "1.0.0"
description = "Hermes Agent skill: turns photos into designed PDF posters + 9:16 MP4 videos"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "Pillow>=10.2",
    "scikit-learn>=1.4",
    "Jinja2>=3.1",
    "playwright>=1.40",
]

[project.optional-dependencies]
clip = [
    # Optional: CLIP embeddings for higher-quality visual clustering.
    # Without these, cluster.py falls back to a deterministic color-histogram
    # embedder which is sufficient for small (<50) photo sets.
    "open-clip-torch>=2.24",
    "torch>=2.1",
]
test = [
    "pytest>=8.0",
    "piexif>=1.1.3",
]
dev = [
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# --------------------------------------------------------------------------
# Node.js dependencies (templates/wrapped/video/package.json)
#
# The Remotion video renderer is a separate Node project. Its deps are NOT
# managed by pip — run `npm install` inside templates/wrapped/video/.
#
#   dependencies:
#     @remotion/bundler    ^4.0.0
#     @remotion/cli        ^4.0.0
#     @remotion/google-fonts ^4.0.0
#     @remotion/renderer   ^4.0.0
#     react                ^18.3.1
#     react-dom            ^18.3.1
#     remotion             ^4.0.0
#
#   devDependencies:
#     @types/react         ^18.3.0
#     @types/react-dom     ^18.3.0
#     typescript           ^5.4.0
# --------------------------------------------------------------------------
